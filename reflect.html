<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formation · Four-Week Reflection</title><style>:root{--bg:#f3efe6;--paper:#fffdf8;--ink:#203027;--muted:#657269;--g:#285641;--deep:#173a2b;--gold:#98744c;--line:#d5ddd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.56 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.w{max-width:860px;margin:auto;padding:24px 18px 80px}.brand{font-weight:900;letter-spacing:.12em}.hero{padding:48px 0 18px}.ey{font-size:.73rem;text-transform:uppercase;letter-spacing:.13em;font-weight:900;color:var(--gold)}h1{font-size:clamp(2.6rem,7vw,4.4rem);line-height:1.03;margin:.15em 0 .25em}h2{font-size:clamp(1.5rem,4vw,2.15rem)}.lead{font-size:1.12rem;color:#506057}.card{background:var(--paper);border-radius:22px;padding:26px;margin:16px 0}.summary{background:var(--deep);color:white}.summary .ey{color:#e3c89e}.row{border-top:1px solid #ffffff2c;padding:13px 0}.row:first-of-type{border-top:0}textarea{width:100%;min-height:100px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:7px}.q{margin:28px 0}button,.btn{display:inline-block;border:0;border-radius:28px;padding:12px 18px;background:var(--g);color:white;text-decoration:none;font-weight:900;font-size:1rem;cursor:pointer}.note{color:var(--muted);font-size:.91rem}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare .card{margin:0}.status{font-weight:800;color:var(--g);margin-top:12px}@media(max-width:700px){.compare{grid-template-columns:1fr}.card{padding:22px 18px}}</style></head><body><main class="w"><div class="brand">FORMATION</div><div class="hero"><div class="ey">Reflect</div><h1>What did you notice?</h1><p class="lead">The point of the four-week experiment was not to complete a spiritual task. It was to notice what happened before God, within you and in the way of Jesus as you practised faithfully.</p></div><div id="app"></div></main><script src="./formation-journey-v4.js?v=41"></script><script>(()=>{const app=document.getElementById('app'),J=window.FormationJourneyV4,j=J.load(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!j){app.innerHTML='<div class="card"><h2>No four-week journey is saved on this device.</h2><p>Complete a Formation profile and choose <strong>Start my four-week journey</strong> first.</p><a class="btn" href="./">Open Formation</a></div>';return}const b=j.baseline||{},days=J.daysRemaining(j),date=new Date(j.returnAt),existing=j.reflection?.answers||{},questions=['What did you notice about God?','What did you notice about yourself?','What became easier?','Where did resistance appear?','What surprised you?'];let html=`<div class="card summary"><div class="ey">Your experiment</div><h2>${esc(b.plan?.headline||'Four-week Formation experiment')}</h2><div class="row"><strong>Anchor:</strong> ${esc(b.anchor||'Open')}</div><div class="row"><strong>Attention:</strong> ${esc(b.attention||'Open Invitation')}</div><div class="row"><strong>Your invitation:</strong> ${esc(b.invitation||'—')}</div>${b.plan?.fruitFocus?.length?`<div class="row"><strong>Fruit to notice:</strong> ${b.plan.fruitFocus.map(esc).join(' + ')}</div>`:''}</div><div class="card"><div class="ey">Four-week reflection</div><h2>${days>0?`You planned to reflect in about ${days} day${days===1?'':'s'}. You can still reflect now.`:'Your reflection window is open.'}</h2><p class="note">Planned reflection date: ${date.toLocaleDateString()}.</p>`;questions.forEach((q,i)=>{html+=`<div class="q"><label><strong>${esc(q)}</strong><textarea data-r="${i}">${esc(existing[i]||'')}</textarea></label></div>`});html+=`<button id="save">Save reflection</button><p id="status" class="status"></p></div>`;if(j.reassessment){const r=j.reassessment.result||{};html+=`<div class="card"><div class="ey">Reassessment</div><h2>Notice movement without turning it into a score.</h2><div class="compare"><div class="card"><strong>Earlier</strong><p>Anchor: ${esc(b.anchor||'Open')}</p><p>Attention: ${esc(b.attention||'Open Invitation')}</p><p>Fruit themes: ${(b.fruit?.themes||[]).map(esc).join(' + ')||'—'}</p></div><div class="card"><strong>Now</strong><p>Anchor: ${esc(r.anchor||'Open')}</p><p>Attention: ${esc(r.attention||'Open Invitation')}</p><p>Fruit themes: ${(r.fruit?.themes||[]).map(esc).join(' + ')||'—'}</p></div></div><p class="note">A changed result does not equal a percentage increase or decrease in spiritual maturity. Ask what the movement helps you notice about this season.</p></div>`}html+=`<div class="card"><div class="ey">Reassess</div><h2>Look again at this season.</h2><p>After reflecting, you can retake the same assessment. Formation will record the new profile alongside this journey without calculating a spiritual growth percentage.</p><a class="btn" href="./scale.html?mode=${encodeURIComponent(b.mode||'quick')}&reassess=1">Reassess now</a></div>`;app.innerHTML=html;document.getElementById('save').onclick=()=>{const answers=[...document.querySelectorAll('[data-r]')].map(x=>x.value.trim());J.saveReflection(answers);document.getElementById('status').textContent='Reflection saved on this device.'}})();</script></body></html>
