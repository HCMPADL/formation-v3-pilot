name: Prepare ShipStatic deployment

on:
  push:
    paths:
      - '.github/workflows/extract-app-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split assessment question data from runtime
        shell: python
        run: |
          from pathlib import Path
          p=Path('pilot-app.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('const Q={')
          marker='};let deep='
          end=s.find(marker,start)
          if start < 0 or end < 0:
              raise SystemExit('Question data markers not found')
          obj=s[start+8:end+1]
          Path('questions.js').write_text('window.FormationQuestions='+obj+';\n',encoding='utf-8')
          s=s[:start]+'const Q=FormationQuestions'+s[end+1:]
          p.write_text(s,encoding='utf-8')
          h=Path('pilot-readable.html').read_text(encoding='utf-8')
          needle='<script src="./pilot-app.js"></script>'
          if './questions.js' not in h:
              h=h.replace(needle,'<script src="./questions.js"></script>\n    '+needle)
              Path('pilot-readable.html').write_text(h,encoding='utf-8')
      - name: Commit deployment sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot-readable.html pilot-app.js questions.js
          git commit -m "Split Formation question data for ShipStatic" || exit 0
          git push