<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formation V3.0 Pilot</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%;}</style></head><body><iframe id="app" title="Formation assessment"></iframe><script>const f=document.getElementById('app');f.src='./pilot-readable.html'+location.search+location.hash;f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;function centre(){requestAnimationFrame(()=>{const c=d.querySelector('#assess .card');if(c)c.scrollIntoView({block:'center',behavior:'auto'})})}const n=w.next,b=w.back;if(typeof n==='function')w.next=function(){n();if(!d.getElementById('assess').classList.contains('hide'))centre()};if(typeof b==='function')w.back=function(){b();centre()};centre()});</script></body></html>
